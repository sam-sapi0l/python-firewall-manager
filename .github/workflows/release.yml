name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to release (e.g. v1.0.0)"
        required: true
        default: "v0.1.0"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools

      - name: Get version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(python -c "import tomllib; f=open('pyproject.toml','rb'); d=tomllib.load(f); print(d['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build wheel and sdist
        run: python -m build

      - name: Create GitHub Release
        uses: softprops/gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: |
            ## What's Changed

            Generated release for version `${{ github.ref_name }}`.

            **Full Changelog**: compare/...${{ github.server_url }}/${{ github.repository }}/compare/...${{ github.event.after }}
          files: dist/**
          draft: false
          prerelease: false

      - name: Verify release assets
        run: |
          ls -la dist/
          sha256sum dist/*