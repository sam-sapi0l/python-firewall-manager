name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Lint with ruff
        run: ruff check .

      - name: Security scan with bandit
        run: bandit -r . -x "*.py" --exclude ".github,__pycache__,.git" -f github || true

      - name: Validate Python syntax
        run: |
          for file in $(find . -name "*.py" -not -path "*/.git/*" -not -path "*/__pycache__/*"); do
            python -m py_compile "$file" || exit 1
          done

      - name: Build wheel and sdist
        run: python -m build

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/