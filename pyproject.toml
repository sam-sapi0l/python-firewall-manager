[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-firewall-manager"
version = "0.1.0"
description = "Python CLI for managing Linux iptables firewall rules with backup, restore and audit logging"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Gabriel", email = "gabriel@example.com" }
]
keywords = ["iptables", "firewall", "linux", "cli", "network-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]

[tool.setuptools.packages.find]
where = ["."]

